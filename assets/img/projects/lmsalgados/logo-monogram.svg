<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">LM Salgados mark construction</title>
  <desc id="desc">L plus M plus a heart equals the LM Salgados brand mark</desc>
  <rect width="720" height="220" fill="#f7f3ea"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="78" y="128" font-size="86" fill="#c9a227">L</text>
    <text x="150" y="118" font-size="42" fill="#5c4033" font-family="system-ui, sans-serif" font-weight="600">+</text>
    <text x="222" y="128" font-size="86" fill="#c9a227">M</text>
    <text x="294" y="118" font-size="42" fill="#5c4033" font-family="system-ui, sans-serif" font-weight="600">+</text>
  </g>
  <!-- heart construction -->
  <g transform="translate(348 52)">
    <path d="M48 18c0-12 8-20 18-20 7 0 12 3 15 9 3-6 8-9 15-9 10 0 18 8 18 20 0 18-16 32-33 52C67 70 48 54 48 18z" fill="#e11d2e"/>
    <path d="M63 18c0-8 5-13 11-13 4 0 7 2 9 6v34c-10-12-20-20-20-27z" fill="#f5c518"/>
  </g>
  <text x="468" y="118" font-size="42" fill="#5c4033" font-family="system-ui, sans-serif" font-weight="600" text-anchor="middle">=</text>
  <!-- final mark -->
  <g transform="translate(520 44)">
    <path d="M48 18c0-12 8-20 18-20 7 0 12 3 15 9 3-6 8-9 15-9 10 0 18 8 18 20 0 18-16 32-33 52C67 70 48 54 48 18z" fill="#e11d2e"/>
    <path d="M63 18c0-8 5-13 11-13 4 0 7 2 9 6v34c-10-12-20-20-20-27z" fill="#f5c518"/>
  </g>
  <text x="360" y="198" font-family="system-ui, sans-serif" font-size="13" fill="#5c4033" text-anchor="middle" letter-spacing="0.18em">L + M + HEART → THE MARK</text>
</svg>
