<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="robots" content="noindex">
  <title>Offline — isaque.it</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <style>
    .offline {
      min-height: 100dvh;
      display: grid;
      place-content: center;
      text-align: center;
      padding: 2rem;
      gap: 1rem;
    }
    .offline img { margin-inline: auto; }
    .offline h1 { font-family: var(--font-display, Newsreader, serif); font-size: clamp(1.75rem, 4vw, 2.5rem); margin: 0; }
    .offline p { margin: 0; opacity: 0.75; max-width: 28ch; margin-inline: auto; }
  </style>
</head>
<body>
  <main class="offline">
    <img src="assets/img/brand/cube.svg" alt="" width="36" height="41">
    <h1>You’re offline</h1>
    <p>Reconnect and try again — or open a page you’ve already visited.</p>
    <a class="btn btn--primary" href="./">Back to isaque.it</a>
  </main>
</body>
</html>
